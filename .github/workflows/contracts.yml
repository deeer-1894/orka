name: Offline contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - run: make test lint test-launcher
      - name: Durable workflow and schedule contracts with isolated test databases
        env:
          ORKA_TEST_MONGO_URI: mongodb://127.0.0.1:27017
        run: |
          go test -race ./orka_control_layer/db ./orka_control_layer/workflow ./orka_control_layer/scheduled_task
          go test -race ./orka_control_layer/service -run TestWorkflowPreparation
  sandbox:
    # 22.04 permits the user namespaces exercised by the production bwrap runner.
    # A missing/blocked sandbox is a test failure, never an accepted skip.
    runs-on: ubuntu-22.04
    env:
      ORKA_REQUIRE_SANDBOX_TEST: '1'
      CODE_SANDBOX_MODE: bwrap
      CODE_BWRAP_PATH: /usr/bin/bwrap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: Install official sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          /usr/bin/bwrap --version
      - name: Require real process, filesystem, network and cancellation isolation
        run: |
          go test -race ./tools_server/runner -run '^TestSandbox' -count=1 -v
          go test -race ./tools_server/tools -run '^TestExecutionOutcomeContract$' -count=1 -v
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npx --prefix web playwright install --with-deps chromium
      - run: make test-web
      - run: npm --prefix web run test:browser
      - run: npm --prefix web run build
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gui_agent/requirements.txt
      - run: python -m pip install -r gui_agent/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: make test-gui
