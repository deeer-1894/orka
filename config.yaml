# Orka local config. Every value can be overridden by the matching env var
# (see .env.example). Do NOT put real secrets here; use env in real deploys.

server:
  control_addr: ":8080"
  tools_addr: ":8090"
  cors_allowed_hosts:
    - "localhost"
    - "127.0.0.1"

llm:
  # OpenAI-compatible endpoint. Defaults to Zhipu GLM; override via env.
  # API key is NOT stored here — set OPENAI_API_KEY in the environment.
  openai_base_url: "https://open.bigmodel.cn/api/paas/v4"
  openai_api_key: ""
  # main drives the orchestrator loop; mini backs summarization/sub-agents and is
  # the failover target for main.
  #
  # This used to advise the FAST tier for main, on the reasoning that the
  # orchestrator makes many calls. Per call that is true and by a lot — measured
  # on a realistic turn (20k context, tools, full output), a reasoning model took
  # 31.3s against 7.3s, spending 83% of its output on thinking. Per TASK it did
  # not hold. Same prompt, three runs:
  #   strong tier   501k tokens  1053s   4/4 subtopics + the finished report
  #   fast tier     352k tokens   578s   did not finish
  #   fast tier     407k tokens   533s   2/4 subtopics, no report; ended early
  #                                      with two plan steps still open
  # The fast model buys its speed back in extra cycles and stops short. Prefer
  # the stronger tier for main until an eval on your own workload says otherwise.
  model: "GLM-5.3-Flash"
  mini_model: "GLM-5.3"
  vlm_model: "GLM-5.3"

storage:
  mongo_uri: "mongodb://localhost:27017"
  mongo_db: "orka"
  redis_addr: "localhost:6379"
  base_storage_path: "./data/storage"

agent:
  checkpoint_ttl_sec: 86400 # 24h: tolerate human delay during clarify
  gui_agent_ws_url: "ws://localhost:8100/api/v1/exec/gui/ws"
  # Runtime: the chat path runs on the cloudwego/eino library by default.
  # Set env EINO_RUNTIME=0 to fall back to the legacy hand-rolled runner.
  # multi_agent: true            # also via MULTI_AGENT=1; lets the orchestrator delegate to sub-agents
  # sub_agents:                  # optional custom registry; omit to use built-in researcher/writer/browser
  #   - name: researcher         # appears to the orchestrator as a delegatable tool
  #     description: "Deep, cited web research from a self-contained brief."
  #     prompt: "You are a rigorous research worker..."   # NEED_USER_INPUT hint is appended automatically
  #     tools: [web_search, fetch_url, http_request, current_time]
  #     model: mini              # mini | main (default mini)
  #     max_iters: 12            # per-delegation tool-iteration cap (default 12)

security:
  ctx_token_secret: "dev-only-change-me" # HMAC secret for signed context tokens
  ctx_token_ttl_sec: 300

obs:
  log_level: "info"
  persist_sampling: 1.0 # 1.0 = persist all; lower to downsample high-freq tool events
