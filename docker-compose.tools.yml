# Runs the tools gateway (and therefore the agent's shell) inside a container,
# so shell commands are confined to the container + the mounted workspace and
# cannot touch the host filesystem (~/.ssh, host files, etc.).
#
#   CTX_TOKEN_SECRET=... BASE_STORAGE_PATH=$HOME/.orka/storage \
#     docker compose -f docker-compose.tools.yml up --build -d
#
# The control layer stays on the host and reaches the gateway at 127.0.0.1:8090
# (unchanged TOOLS_MCP_URL). The workspace volume is shared so files the agent
# writes in the container appear for the host file API and vice-versa.
services:
  tools:
    build:
      context: .
      dockerfile: tools_server/Dockerfile
      args:
        # Unset means the Dockerfile's upstream default; set GOPROXY in .env on
        # a network where proxy.golang.org is unreachable.
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: orka-tools
    container_name: orka-tools
    # Reap orphaned command descendants after timeout/process-group cleanup.
    init: true
    # Match the owner of the host bind-mounted workspace.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      # host workspace  ->  container /workspace (BASE_STORAGE_PATH in the image)
      - "${BASE_STORAGE_PATH:-./data/storage}:/workspace"
    environment:
      # Must match the control layer so the HMAC context token validates.
      - CTX_TOKEN_SECRET=${CTX_TOKEN_SECRET:?set CTX_TOKEN_SECRET}
      - CODE_EXECUTION=${CODE_EXECUTION:-0}
      - CODE_SANDBOX_MODE=bwrap
      - TOOLS_ADDR=:8090
      - BASE_STORAGE_PATH=/workspace
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # web_search runs HERE, so a key set only in .env never reached it: the
      # keyless DuckDuckGo/Wikipedia fallback stayed in force and returned
      # "temporarily unavailable" on 390 of 391 calls. Empty is the same as unset
      # (searchProviders skips blanks), so listing all four is safe.
      - DOUBAO_SEARCH_API_KEY=${DOUBAO_SEARCH_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - SEARXNG_URL=${SEARXNG_URL:-}
    restart: unless-stopped
    # Tighten the container: drop privileges, no new privileges via setuid.
    security_opt:
      - no-new-privileges:true
      - seccomp=./tools_server/security/seccomp-bwrap.json
    cap_drop:
      - ALL
    # Cap resources so a runaway command can't exhaust the host.
    mem_limit: 2g
    pids_limit: 256

  # GUI execution receives a frozen, verified per-run model connection from
  # the control service. No provider credential is loaded from this container.
  # noVNC is a loopback-only administrator debugging surface; product users
  # receive only their own run's screenshot/action events.
  gui:
    build:
      context: ./gui_agent
      dockerfile: Dockerfile
    image: orka-gui
    container_name: orka-gui
    ports:
      - "127.0.0.1:8100:8100" # WebSocket exec API (run_agent)
      - "127.0.0.1:6080:6080" # noVNC live browser view
    environment:
      - GUI_PORT=8100
      - GUI_PLANNER=${GUI_PLANNER:-vlm}
      - MACRO_ENABLE=0
      - GUI_AUTH_TOKEN=${GUI_AUTH_TOKEN:?set GUI_AUTH_TOKEN}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Chromium needs a roomy /dev/shm or it crashes rendering large pages.
    shm_size: 1gb
    mem_limit: 3g
    pids_limit: 512
