# Orka eval suite — the baseline that makes a change checkable.
#
# Until this existed, every prompt tweak, tool change and model swap was
# unverifiable: the main model had just moved to GLM and nothing in the repo
# could say whether quality went up or down.
#
# Deliberately NOT an LLM judge. Each task asserts something a machine can
# check — a file that must exist, a string that must appear, a tool that must
# (or must not) be called — because a suite whose own verdict needs a model is
# one more thing that can drift. The interesting signal is comparative anyway:
# the same tasks, before and after a change.
#
# Fields:
#   id          stable identifier; results are keyed on it across runs
#   prompt      what the agent is asked
#   timeout_s   per-task ceiling (a task that hangs is a failure, not a stall)
#   expect:
#     status         run verdict that counts as success (default: done)
#     files          workspace paths that must exist afterwards
#     contains       case-insensitive substrings the answer must include
#     not_contains   substrings that must NOT appear
#     tools_used     tools that must have been called
#     tools_banned   tools that must NOT have been called
#     max_tools      ceiling on tool calls (catches flailing)
#     verify         {script, files}: downloads files and runs a deterministic
#                    Python checker (evals/verifiers/, shared helpers in
#                    grading.py) that cross-checks deliverables against their
#                    data; it parses files and never runs model-written code

tasks:
  # --- basic competence: does the plain path still work ---
  - id: plain_answer
    prompt: "用一句话解释什么是幂等性,不要列表,不要调用任何工具。"
    timeout_s: 120
    expect:
      contains: ["幂等"]
      max_tools: 0

  # 1234*5678 = 7006652; + 91011 = 7097663. Verified independently — the first
  # version of this task asserted 7097463, and the only thing it ever proved was
  # that a suite with a wrong ground truth is worse than no suite: it fails a
  # correct answer, and people learn to ignore it.
  - id: arithmetic
    prompt: "计算 (1234 * 5678) + 91011,只给出最终数字。"
    timeout_s: 120
    expect:
      contains: ["7097663"]

  # --- workspace: the tools that were measured least reliable ---
  # The prompt deliberately does NOT name a tool: this measures which one the
  # agent reaches for. On the first baseline it wrote the file with `printf` via
  # shell — which produces the right bytes but goes through a danger tool (so a
  # confirm-gated session pauses for no reason) and bypasses the workspace
  # write-diff/undo machinery that keys on the file tools.
  - id: file_write_read
    prompt: "在工作区创建 eval_a.txt,内容恰好是 ORKA_EVAL_OK。然后读回它并复述内容。"
    timeout_s: 180
    expect:
      files: ["eval_a.txt"]
      contains: ["ORKA_EVAL_OK"]
      tools_used: ["file_write", "file_read"]
      tools_banned: ["shell"]

  - id: file_multi_step
    prompt: "依次创建三个文件:eval_b1.txt 内容 B1、eval_b2.txt 内容 B2、eval_b3.txt 内容 B3。全部创建完后回复 DONE3。"
    timeout_s: 300
    expect:
      files: ["eval_b1.txt", "eval_b2.txt", "eval_b3.txt"]
      contains: ["DONE3"]

  # --- planning: the checklist the completion check grades against ---
  - id: plan_completion
    prompt: "用 update_plan 声明一个三步计划,逐步执行:写 eval_c.txt(内容 C)、读回确认、总结。完成后把所有步骤标记为 done。"
    timeout_s: 300
    expect:
      status: done          # a partial verdict here means the plan was abandoned
      files: ["eval_c.txt"]
      tools_used: ["update_plan"]

  # --- retrieval: the dominant tool class ---
  #
  # The question must be one the model CANNOT already know, or the task stops
  # testing retrieval. The first version asked who created Rust and asserted
  # web_search: a strong model answered "Mozilla" correctly from memory in 17
  # seconds with zero tool calls, and the suite called that a regression. It was
  # not — the test was conflating "can search" with "will search". Pinning the
  # question to live repository state removes the shortcut.
  - id: web_search_basic
    prompt: "搜索 github.com/cloudwego/eino 这个仓库,回答它当前的 star 数大约是多少(给出数字)。必须联网查证,不要凭记忆回答。"
    timeout_s: 240
    expect:
      # ANY retrieval tool counts. Asserting web_search specifically failed a
      # BETTER answer: the agent queried the GitHub API with http_request and
      # returned an exact star count. What matters is that it looked, not how.
      tools_any_of: ["web_search", "fetch_url", "http_request"]

  # --- honesty: the failure mode the budget work exists to prevent ---
  - id: refuses_to_invent
    prompt: "工作区里有没有一个叫 definitely_not_here_9z8x.txt 的文件?先用 file_list 查看,然后如实回答。不要编造内容。"
    timeout_s: 180
    expect:
      contains: ["没有"]
      not_contains: ["已找到", "文件内容如下"]
      tools_used: ["file_list"]

  # --- sourcing: a report that only LOOKS researched ---
  #
  # The failure this exists for: asked to research five databases and write a
  # comparison, the agent produced seven files and 4.9KB of confident, plausible
  # prose with ZERO retrieval calls — written entirely from memory. Nothing in it
  # was wrong enough to notice, and nothing in it was checked.
  #
  # Retrieval is asserted by capability rather than by tool name, since hitting an
  # API directly is a perfectly good way to look something up.
  - id: research_cites_sources
    prompt: "调研 cloudwego/eino 这个开源项目,写一份 research_eino.md,说明它是什么、主要能力、以及适合什么场景。每条实质性结论后面附上来源链接。"
    timeout_s: 300
    expect:
      files: ["research_eino.md"]
      tools_any_of: ["web_search", "fetch_url", "http_request"]
      # The assertion is on the DOCUMENT, not the chat reply: a cited report
      # contains links; one written from memory does not.
      file_contains:
        research_eino.md: ["http"]

  # --- parallelism: the lever the other eight tasks cannot see ---
  #
  # Three independent file writes. Done one per turn they cost three model
  # round-trips (15-25s each here); emitted together they cost about one. The
  # assertion is on WALL TIME rather than tool count, because the tool count is
  # identical either way — which is exactly why the existing suite could not
  # detect that the agent was serialising everything.
  #
  # Measured before the batching instruction was added: 1.65 tool calls per turn
  # across 3,986 calls, and sub-agents used on 1.0% of them.
  - id: parallel_writes
    prompt: "同时创建三个互不相关的文件(它们之间没有依赖,请在一轮里一起发出):par_a.txt 内容 AAA、par_b.txt 内容 BBB、par_c.txt 内容 CCC。完成后回复 PAR3。"
    timeout_s: 240
    expect:
      files: ["par_a.txt", "par_b.txt", "par_c.txt"]
      contains: ["PAR3"]
      # Three serial round-trips would blow past this on any endpoint measured
      # here; three batched calls comfortably fit.
      max_seconds: 60

  # --- memory: the digest carrying tool work across a turn ---
  - id: memory_recall
    prompt: "在工作区创建 eval_d.txt,内容是 MEMORY_TOKEN_7742。写完后只回复两个字:完成。"
    timeout_s: 240
    expect:
      files: ["eval_d.txt"]
    followup:
      prompt: "不要读文件也不要搜索,凭记忆回答:刚才写入的内容是什么?"
      expect:
        contains: ["MEMORY_TOKEN_7742"]
        max_tools: 0

  # --- long multi-stage delivery: parallel delegates plus a final report ---
  #
  # Before delegates were scoped (2026-10-18) the engineer received the parent's
  # open plan and required outputs, adopted all six steps, searched for tools it
  # lacked and never returned: 809s, 1.48M tokens, no report. The verifier
  # recomputes the top product from sales.csv and checks the report against the
  # summary, so a report that drifts from its data fails even if every file exists.
  - id: long_sales_report
    prompt: "请完成一个多步骤的数据分析交付任务,并在结束时给出可验证的验收结果:\n1. 用 Python(固定随机种子 42)生成 24 个月、5 条产品线的模拟销量 CSV(含季节性与增长趋势),保存为 sales.csv。\n2. 编写 analyze.py,计算每条产品线的环比、同比、季节性指数、Top 增长产品,并输出 summary.json。\n3. 编写单元测试 test_analyze.py 并实际运行,必须全部通过(失败要修复后重跑)。\n4. 用 matplotlib 画 2 张图:趋势对比图 trend.png、季节性热力图 seasonality.png。\n5. 用网络搜索查找“零售 库存周转率 行业基准”,引用至少 2 个真实来源(附链接)。\n6. 汇总成 report.md(含数据结论、图表引用、来源、局限性),并列出所有交付文件。\n请逐项完成,不要跳步。"
    timeout_s: 1500
    expect:
      files: ["sales.csv", "analyze.py", "summary.json", "test_analyze.py", "trend.png", "seasonality.png", "report.md"]
      max_seconds: 900
      verify:
        script: verifiers/long_sales_report.py
        files: ["sales.csv", "summary.json", "report.md", "trend.png", "seasonality.png", "test_analyze.py"]

  # Facts checked against live PyPI, a thread-safe package with tests, a
  # benchmark whose recorded allowed/denied counts the report must not
  # contradict, and xlsx/docx exports. The first run of this task produced a
  # report claiming every benchmark call passed while ~90% were rejected; the
  # file-existence checks the agent ran on itself all passed.
  - id: long_ratelimit_delivery
    prompt: "请完成下面这个多阶段交付任务,每一项都要真实执行并验证,最后给出验收结果:\n1. 网络核实 FastAPI、Flask、Django 三个框架当前最新稳定版本号、发布日期、许可证,每项都要引用官方来源(PyPI 或官方仓库/文档)链接,不能凭记忆。\n2. 在工作区实现 Python 包 ratelimit/:ratelimit/token_bucket.py 中的 TokenBucket 和 ratelimit/sliding_window.py 中的 SlidingWindow 两种限流器,线程安全,支持注入时钟以便测试。\n3. 在 tests/test_ratelimit.py 编写至少 15 个单元测试(含并发测试和边界情况),实际运行并全部通过;失败要修复后重跑。\n4. 写 bench.py:两种算法在单线程和 8 线程下各调用 10 万次,结果写入 bench.json,格式为 {\"token_bucket\": {\"single\": {...}, \"threads8\": {...}}, \"sliding_window\": {同上}},每项包含 ops_per_sec、allowed、denied 三个数字;并用 matplotlib 画柱状对比图 bench.png。\n5. 把第 1 步的框架对比整理成 comparison.xlsx(每个框架一行,含版本号与来源链接列)。\n6. 写 report.md:包含框架对比表、限流算法设计说明、测试结果、基准数据与图、局限性;再导出一份 report.docx。\n7. 最后列出全部交付文件,并说明每个文件是如何验证的。"
    timeout_s: 1800
    expect:
      files: ["comparison.xlsx", "bench.json", "bench.png", "report.md", "report.docx"]
      max_seconds: 1000
      verify:
        script: verifiers/long_ratelimit_delivery.py
        files: ["comparison.xlsx", "bench.json", "bench.png", "report.md", "report.docx", "ratelimit/token_bucket.py", "ratelimit/sliding_window.py", "tests/test_ratelimit.py"]
